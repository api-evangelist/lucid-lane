name: Lucid Lane
description: 'Lucid Lane (now operating as Skyler Health) is a telehealth mental
  health platform delivering virtual talk therapy and counseling for mental health
  conditions, an AI-powered coaching companion, and guided meditation and mindfulness
  content through its Listen Therapy service. Originally founded to help patients
  taper off opioids and manage medication dependence during and after surgery, the
  company has since broadened into remote behavioral and mental health care delivered
  to members, employers, clinics, and providers. It is a consumer- and employer-facing
  care service with no public developer or API surface; member access is via the
  Skyler Health member portal. Backed by Accel and Battery Ventures.'
